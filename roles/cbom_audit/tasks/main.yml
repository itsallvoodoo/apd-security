---

- name: Create temporary directory in EE for local results
  ansible.builtin.tempfile:
    state: directory
    prefix: "{{ cbom_audit_local_report_dir }}"
  delegate_to: localhost
  become: false
  register: ee_temp_dir

- name: Run RHEL 9 CBOM audit
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == "RedHat"

- name: Run Windows CBOM audit
  ansible.builtin.include_tasks: windows.yml
  when: ansible_os_family == "Windows"

- name: Fail on unsupported operating system family
  ansible.builtin.fail:
    msg: "Unsupported OS family '{{ ansible_os_family }}' on {{ inventory_hostname }}."
  when: ansible_os_family not in ["RedHat", "Windows"]




