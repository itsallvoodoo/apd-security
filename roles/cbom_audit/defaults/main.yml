---
# defaults file for cbom_audit
cbom_audit_local_report_dir: "cbom_reports"

# Linux-specific defaults
cbom_audit_remote_work_dir: "/tmp/cbom_audit_{{ ansible_date_time.epoch }}"
cbom_audit_pki_search_paths:
  - /etc/pki
  - /etc/ssl
  - /etc/ssh
  - /etc/letsencrypt
  - /etc/httpd
  - /etc/nginx
  - /etc/haproxy
  - /opt
cbom_audit_exclude_paths:
  - /etc/pki/ca-trust
  - /etc/pki/java
  - /etc/pki/tls/certs/ca-bundle.crt
  - /etc/pki/tls/certs/ca-bundle.trust.crt
cbom_audit_web_conf_dirs:
  - /etc/httpd
  - /etc/nginx
  - /etc/haproxy
  - /etc/postfix
  - /etc/dovecot

# Windows-specific defaults
cbom_audit_win_remote_work_dir: 'C:\Windows\Temp\cbom_audit_{{ ansible_date_time.epoch }}'
cbom_audit_win_cert_stores:
  - Cert:\LocalMachine\My
  - Cert:\LocalMachine\WebHosting
  - Cert:\LocalMachine\CA
cbom_audit_win_file_search_paths:
  - C:\inetpub
  - C:\ProgramData
  - C:\certs